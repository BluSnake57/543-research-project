[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-desktop"
version = "0.1.0"
description = "Local evidence retrieval and GraphSAGE virality analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.1,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "platformdirs>=4.3,<5",
  "torch>=2.6,<3",
  "sentence-transformers>=3.4,<6", "hnswlib>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
veritas = "veritas.cli:main"

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
