[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x-desktop"
version = "0.1.0"
description = "Local evidence retrieval and GraphSAGE virality analysis"
requires-python = ">=3.11,<3.16"
dependencies = [
  "numpy>=2.1", "PySide6-Essentials>=6.8,<7", "torch>=2.6,<3",
  "sentence-transformers>=3.4,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
sentinel-x = "sentinel_x.cli:main"

[project.gui-scripts]
sentinel-x-desktop = "sentinel_x.desktop:main"
sentinel-x-trainer = "sentinel_x.trainer:main"

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]

[tool.setuptools.package-data]
sentinel_x = ["assets/*.json", "assets/skills/*/*"]
