worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 1k;
    limit_req_zone $binary_remote_addr zone=exports:1m rate=5r/s;
    server {
        listen 6080;
        root /usr/share/novnc;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            root /opt/container;
            try_files /index.html =404;
            default_type text/html;
        }

        location /websockify {
            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /exports/ {
            alias /home/sentinel/Exports/;
            autoindex on;
            disable_symlinks on;
            auth_basic "Sentinel-X exports (user: sentinel)";
            auth_basic_user_file /tmp/downloads.htpasswd;
            limit_req zone=exports burst=20 nodelay;
            limit_except GET { deny all; }
            types { }
            default_type application/octet-stream;
        }

        location / {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
    }
}
