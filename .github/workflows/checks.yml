name: Python checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check src/backend scripts tests
      - run: ruff check docker
      - run: ruff format --check docker scripts/create_container_secret.py scripts/check_container_config.py tests/test_container_secret.py tests/test_container_integration.py
      - run: bash -n docker/entrypoint.sh docker/with-display.sh
