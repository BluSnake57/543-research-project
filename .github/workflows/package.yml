name: Package native Python desktop
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_app.py
      - if: runner.os == 'Linux'
        run: dist/Sentinel-X/Sentinel-X --startup-check
      - if: runner.os == 'Windows'
        run: dist/Sentinel-X/Sentinel-X.exe --startup-check
      - if: runner.os == 'macOS'
        run: dist/Sentinel-X.app/Contents/MacOS/Sentinel-X --startup-check
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-X-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
