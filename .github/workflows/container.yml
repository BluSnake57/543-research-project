name: Container desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create local desktop password
        run: python3 scripts/create_container_secret.py
      - name: Validate CUDA configuration
        run: docker compose config --quiet
      - name: Build and launch CPU smoke test
        run: docker compose -f compose.yaml -f compose.cpu.yaml up --build --wait --wait-timeout 180 -d
      - name: Check desktop, downloads, and protections
        run: docker compose exec -T desktop python /opt/container/smoke_test.py
      - name: Confirm storage survives recreation
        run: |
          docker compose exec -T desktop python -c 'from pathlib import Path; (Path.home() / "Exports/persistence.txt").write_text("preserved")'
          docker compose -f compose.yaml -f compose.cpu.yaml up --force-recreate --wait --wait-timeout 180 -d
          docker compose exec -T desktop python -c 'from pathlib import Path; assert (Path.home() / "Exports/persistence.txt").read_text() == "preserved"'
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose -f compose.yaml -f compose.cpu.yaml down --volumes
