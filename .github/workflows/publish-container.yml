name: Publish desktop image

on:
  push:
    branches: [main, docker-novnc-desktop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTAINER_CPUS: "2"
      CONTAINER_MEMORY: 4g
      COMPUTE_THREADS: "2"
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase registry name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Image tags and repository labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build CUDA image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            sentinel-x-desktop:publish-test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Test CUDA image desktop without requiring a GPU runner
        env:
          SENTINEL_IMAGE: sentinel-x-desktop:publish-test
        run: |
          python3 scripts/create_container_secret.py
          docker compose -f compose.yaml -f compose.cpu.yaml up --no-build --wait --wait-timeout 180 -d
          docker compose exec -T desktop python /opt/container/smoke_test.py
          docker compose exec -T desktop python -c 'import torch; assert torch.version.cuda == "12.8"'
      - name: Test logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test desktop
        if: always()
        run: docker compose -f compose.yaml -f compose.cpu.yaml down --volumes
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
          printf 'Published images:\n```text\n%s\n```\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"

  release-download:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PUBLISHED_IMAGE: ${{ needs.publish.outputs.image }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export downloadable Docker archive
        shell: bash
        run: |
          docker pull "$PUBLISHED_IMAGE"
          mkdir image-export
          docker image save "$PUBLISHED_IMAGE" | gzip -1 | split -b 1900M - image-export/sentinel-x-image.tar.gz.part-
          printf '%s\n' "$PUBLISHED_IMAGE" > image-export/IMAGE.txt
      - name: Checksum release assets
        working-directory: image-export
        run: sha256sum sentinel-x-image.tar.gz.part-* IMAGE.txt > SHA256SUMS
      - name: Create release if needed and attach image files
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/release-image-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" image-export/* --clobber
